name: Deploy Royal Ludo 3D Firestore Rules (Free Tier)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROYEL_LUDO_3D }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_ROYEL_LUDO_3D."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROYEL_LUDO_3D }}

      - name: Set up Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore security rules only (no paid Cloud Functions)
        run: firebase deploy --only firestore:rules --project royel-ludo-3d --non-interactive
