name: Deploy Royal Ludo 3D Firebase Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and test Cloud Functions
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Check Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROYEL_LUDO_3D }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_ROYEL_LUDO_3D. Add the Firebase deploy service-account JSON as a repository Actions secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROYEL_LUDO_3D }}

      - name: Set up Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules and Cloud Functions
        run: firebase deploy --only firestore:rules,functions --project royel-ludo-3d
