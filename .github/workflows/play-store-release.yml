name: Royal Ludo 3D Play Store Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require upload signing secrets
        env:
          KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ADMOB_APP: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          test -n "$KEY" && test -n "$STORE" && test -n "$PASS" && test -n "$ADMOB_APP" && test -n "$ADMOB_BANNER" || {
            echo "::error::Add upload signing secrets plus ADMOB_APP_ID and ADMOB_BANNER_ID production AdMob secrets first."
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o royal-ludo-3d.zip -d project
          cp -a project/. .

      - name: Configure Firebase Android SDK
        run: |
          python3 .github/scripts/configure_firebase_android.py
          mkdir -p app
          cp firebase/google-services.json app/google-services.json
          test -s app/google-services.json

      - name: Integrate game features
        run: |
          python3 .github/scripts/integrate_online_android.py
          python3 .github/scripts/integrate_online_ui.py
          python3 .github/scripts/integrate_snakes_ladders.py
          python3 .github/scripts/integrate_admob.py
          python3 .github/scripts/enable_single_human_mode.py
          python3 .github/scripts/polish_ui.py app/src/main/java/com/example/MainActivity.kt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Play upload key
        env:
          KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Build signed Play Store bundle
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-3D-Play-Store-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
