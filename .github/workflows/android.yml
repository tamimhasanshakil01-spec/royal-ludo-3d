
name: Build Royal Ludo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o royal-ludo-3d.zip -d project
          cp -a project/. .

      - name: Apply Royal Arena UI polish
        run: python3 .github/scripts/polish_ui.py app/src/main/java/com/example/MainActivity.kt

      - name: Package final Android source for review
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-Source
          path: |
            app/
            gradle/
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
          if-no-files-found: error

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: royal-ludo-debug-signing-key-v1

      - name: Generate debug keystore
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-APK
          path: app/build/outputs/apk/debug/*.apk
