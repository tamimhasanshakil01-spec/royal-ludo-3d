
name: Build Royal Ludo 3D APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Type-check Firebase Cloud Functions
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Extract Android project
        run: |
          unzip -o royal-ludo-3d.zip -d project
          cp -a project/. .

      - name: Configure Firebase Android SDK
        run: |
          python3 .github/scripts/configure_firebase_android.py
          mkdir -p app
          cp firebase/google-services.json app/google-services.json
          test -s app/google-services.json
          echo "Matching Firebase Android app configuration installed."

      - name: Integrate Android Firebase online game client
        run: python3 .github/scripts/integrate_online_android.py

      - name: Connect online game screen to Android navigation
        run: python3 .github/scripts/integrate_online_ui.py

      - name: Apply Royal Ludo 3D UI polish
        run: python3 .github/scripts/polish_ui.py app/src/main/java/com/example/MainActivity.kt

      - name: Apply Royal Ludo 3D branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s = s.replace('Royel Ludo 3D', 'Royal Ludo 3D').replace('ROYEL LUDO 3D', 'ROYAL LUDO 3D').replace('ROYEL WALLET', 'ROYAL WALLET')
          strings.write_text(s, encoding='utf-8')
          main = Path('app/src/main/java/com/example/MainActivity.kt')
          s = main.read_text(encoding='utf-8')
          s = s.replace('ROYEL LUDO 3D', 'ROYAL LUDO 3D').replace('ROYEL WALLET', 'ROYAL WALLET')
          main.write_text(s, encoding='utf-8')
          print('App branding standardized to Royal Ludo 3D; Firebase project ID retained to preserve the existing connection.')
          PY

      - name: Package final Android source for review
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-Source
          path: |
            app/
            gradle/
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
          if-no-files-found: error

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: royal-ludo-debug-signing-key-v1

      - name: Generate debug keystore
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Export Firebase Google Sign-In SHA-1
        run: |
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | tee firebase-sha1.txt
          grep -E 'SHA1:' firebase-sha1.txt

      - name: Upload Firebase signing fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Firebase-SHA1-Fingerprint
          path: firebase-sha1.txt

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-3D-APK
          path: app/build/outputs/apk/debug/*.apk
